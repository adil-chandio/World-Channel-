# Fetch a raw clip from a URL the sandbox cannot reach, using a GitHub-hosted
# runner as the downloader, then commit it back to the same branch.
# Supports direct mp4 URLs (curl) AND page URLs (yt-dlp) with alt-URL fallback.
# ALWAYS commits fetch_log.txt next to the clip so failures are debuggable.
name: fetch-clip

on:
  workflow_dispatch:
  push:
    paths:
      - "ops/clip-fetch-request.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse request
        id: req
        run: |
          python3 - <<'EOF'
          import re, os, pathlib
          req = pathlib.Path("ops/clip-fetch-request.yml").read_text()
          def val(key, default=""):
              m = re.search(rf"^{key}:\s*(.+)$", req, re.M)
              return m.group(1).strip() if m else default
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as f:
              f.write(f"url={val('url')}\n")
              f.write(f"url_alt1={val('url_alt1')}\n")
              f.write(f"url_alt2={val('url_alt2')}\n")
              f.write(f"out={val('out')}\n")
              f.write(f"thumb={val('thumb')}\n")
              f.write(f"thumb_out={val('thumb_out')}\n")
              f.write(f"name={val('name')}\n")
          EOF

      - name: Download clip
        run: |
          set +e
          OUTDIR="$(dirname '${{ steps.req.outputs.out }}')"
          mkdir -p "$OUTDIR"
          LOG="$OUTDIR/fetch_log.txt"
          echo "FAILED" > "$OUTDIR/fetch_status.txt"
          echo "=== fetch-clip $(date -u) ===" > "$LOG"
          python3 -m pip install --quiet yt-dlp >> "$LOG" 2>&1
          echo "pip exit: $?" >> "$LOG"
          echo "yt-dlp version: $(python3 -m yt_dlp --version 2>&1)" >> "$LOG"
          for U in '${{ steps.req.outputs.url }}' '${{ steps.req.outputs.url_alt1 }}' '${{ steps.req.outputs.url_alt2 }}'; do
            if [ -z "$U" ]; then continue; fi
            echo "" >> "$LOG"
            echo "=== Trying $U" >> "$LOG"
            rm -f /tmp/clip.mp4
            case "$U" in
              *.mp4|*.mp4\?*|*.m4v|*.mov)
                curl -fsSL --retry 2 --max-time 300 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" "$U" -o /tmp/clip.mp4 >> "$LOG" 2>&1
                echo "curl exit: $?" >> "$LOG"
                ;;
              *)
                python3 -m yt_dlp --no-playlist --no-warnings -f "b/bv*+ba/bv*/b*" --remux-video mp4 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -o /tmp/clip.mp4 "$U" >> "$LOG" 2>&1
                echo "yt-dlp exit: $?" >> "$LOG"
                ;;
            esac
            if [ -s /tmp/clip.mp4 ]; then
              SIZE=$(stat -c%s /tmp/clip.mp4)
              echo "got $SIZE bytes" >> "$LOG"
              if [ "$SIZE" -gt 300000 ]; then
                cp /tmp/clip.mp4 '${{ steps.req.outputs.out }}'
                echo "OK" > "$OUTDIR/fetch_status.txt"
                echo "SUCCESS from $U" >> "$LOG"
                break
              fi
            fi
          done
          echo "" >> "$LOG"
          echo "final status: $(cat "$OUTDIR/fetch_status.txt")" >> "$LOG"
          cat "$LOG"

      - name: Commit clip
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUTDIR="$(dirname '${{ steps.req.outputs.out }}')"
          git add -f '${{ steps.req.outputs.out }}'
          git add -f "$OUTDIR/fetch_log.txt"
          git add -f "$OUTDIR/fetch_status.txt"
          if [ -n '${{ steps.req.outputs.thumb }}' ]; then
            curl -fsSL --retry 2 --max-time 60 -A "Mozilla/5.0" '${{ steps.req.outputs.thumb }}' -o '${{ steps.req.outputs.thumb_out }}'
            git add -f '${{ steps.req.outputs.thumb_out }}'
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fetch: ${{ steps.req.outputs.name }} (raw clip via actions)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check status
        run: |
          ST=$(cat "$(dirname '${{ steps.req.outputs.out }}')/fetch_status.txt")
          echo "fetch status: $ST"
          [ "$ST" = "OK" ]
