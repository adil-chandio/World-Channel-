# Fetch a raw clip from a URL the sandbox cannot reach, using a GitHub-hosted
# runner as the downloader, then commit it back to the same branch.
# Supports direct mp4 URLs (curl) AND page URLs (yt-dlp) with alt-URL fallback.
# ALWAYS commits pipeline/produce/<dir>/fetch_log.txt so failures are debuggable
# even when Actions log retrieval is unavailable.
name: fetch-clip

on:
  workflow_dispatch:
  push:
    paths:
      - "ops/clip-fetch-request.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse request
        id: req
        run: |
          python3 - <<'EOF'
          import re, os, pathlib
          req = pathlib.Path("ops/clip-fetch-request.yml").read_text()
          def val(key, default=""):
              m = re.search(rf"^{key}:\s*(.+)$", req, re.M)
              return m.group(1).strip() if m else default
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as f:
              f.write(f"url={val('url')}\n")
              f.write(f"url_alt1={val('url_alt1')}\n")
              f.write(f"url_alt2={val('url_alt2')}\n")
              f.write(f"out={val('out')}\n")
              f.write(f"thumb={val('thumb')}\n")
              f.write(f"thumb_out={val('thumb_out')}\n")
              f.write(f"name={val('name')}\n")
          EOF

      - name: Download clip
        id: dl
        run: |
          set +e
          OUTDIR=$(dirname "${{ steps.req.outputs.out }}")
          mkdir -p "$OUTDIR"
          LOG="$OUTDIR/fetch_log.txt"
          STATUS="$OUTDIR/fetch_status.txt"
          echo "FAILED" > "$STATUS"
          {
            echo "=== fetch-clip $(date -u) ==="
            echo "python: $(python3 --version)"
            echo "pip install yt-dlp..."
            python3 -m pip install --quiet yt-dlp 2>&1
            echo "yt-dlp: $(yt-dlp --version 2>&1)"
            try_url() {
              U="$1"
              if [ -z "$U" ]; then echo "[skip empty url]"; return 1; fi
              echo ""
              echo "=== Trying: $U"
              rm -f /tmp/clip.mp4
              if echo "$U" | grep -qE '\.(mp4|m4v|mov)(\?|$)'; then
                curl -fsSL --retry 2 --max-time 300 \
                  -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
                  "$U" -o /tmp/clip.mp4 2>&1
                echo "curl exit: $?"
              else
                yt-dlp --no-playlist --no-warnings \
                  -f "b/bv*+ba/bv*/b*" --remux-video mp4 \
                  -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
                  -o /tmp/clip.mp4 "$U" 2>&1
                echo "yt-dlp exit: $?"
              fi
              if [ -s /tmp/clip.mp4 ]; then
                echo "got file: $(ls -la /tmp/clip.mp4)"
                return 0
              fi
              return 1
            }
            try_url "${{ steps.req.outputs.url }}"
            if [ ! -s /tmp/clip.mp4 ]; then try_url "${{ steps.req.outputs.url_alt1 }}"; fi
            if [ ! -s /tmp/clip.mp4 ]; then try_url "${{ steps.req.outputs.url_alt2 }}"; fi
            echo ""
            if [ -s /tmp/clip.mp4 ]; then
              SIZE=$(stat -c%s /tmp/clip.mp4)
              HEAD=$(head -c 256 /tmp/clip.mp4 | xxd | head -4)
              echo "size=$SIZE"
              echo "head: $HEAD"
              if [ "$SIZE" -gt 300000 ]; then
                echo "OK" > "$STATUS"
                cp /tmp/clip.mp4 "${{ steps.req.outputs.out }}"
              else
                echo "file too small ($SIZE) - FAILED"
              fi
            else
              echo "ALL SOURCES FAILED"
            fi
          } > "$LOG" 2>&1
          cat "$LOG"
          echo "status=$(cat $STATUS)"
          exit 0

      - name: Commit clip
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.req.outputs.out }}" "$(dirname "${{ steps.req.outputs.out }}")/fetch_log.txt" "$(dirname "${{ steps.req.outputs.out }}")/fetch_status.txt" 2>/dev/null || true
          if [ -n "${{ steps.req.outputs.thumb }}" ]; then
            curl -fsSL --retry 2 --max-time 60 -A "Mozilla/5.0" \
              "${{ steps.req.outputs.thumb }}" -o "${{ steps.req.outputs.thumb_out }}" || true
            git add -f "${{ steps.req.outputs.thumb_out }}" 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fetch: ${{ steps.req.outputs.name }} (raw clip via actions)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check status
        run: |
          ST=$(cat "$(dirname "${{ steps.req.outputs.out }}")/fetch_status.txt")
          echo "fetch status: $ST"
          [ "$ST" = "OK" ]
