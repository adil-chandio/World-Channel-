# Fetch a raw clip from a URL the sandbox cannot reach, using a GitHub-hosted
# runner as the downloader, then commit it back to the same branch.
# Triggered by any push that touches ops/clip-fetch-request.yml, or manually.
# Supports direct mp4 URLs (curl) AND page URLs like BBC/CBS/YouTube (yt-dlp).
name: fetch-clip

on:
  workflow_dispatch:
  push:
    paths:
      - "ops/clip-fetch-request.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse request
        id: req
        run: |
          python3 - <<'EOF'
          import re, os, pathlib
          req = pathlib.Path("ops/clip-fetch-request.yml").read_text()
          def val(key, default=""):
              m = re.search(rf"^{key}:\s*(.+)$", req, re.M)
              return m.group(1).strip() if m else default
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as f:
              f.write(f"url={val('url')}\n")
              f.write(f"url_alt1={val('url_alt1')}\n")
              f.write(f"url_alt2={val('url_alt2')}\n")
              f.write(f"out={val('out')}\n")
              f.write(f"thumb={val('thumb')}\n")
              f.write(f"thumb_out={val('thumb_out')}\n")
              f.write(f"name={val('name')}\n")
          EOF

      - name: Download clip
        run: |
          set -e
          URL="${{ steps.req.outputs.url }}"
          ALT1="${{ steps.req.outputs.url_alt1 }}"
          ALT2="${{ steps.req.outputs.url_alt2 }}"
          pip install --quiet yt-dlp
          try_fetch() {
            U="$1"
            [ -z "$U" ] && return 1
            echo "=== Trying: $U"
            rm -f /tmp/clip.mp4
            if echo "$U" | grep -qE '\.(mp4|m4v|mov)(\?|$)'; then
              curl -fsSL --retry 3 --max-time 300 \
                -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
                "$U" -o /tmp/clip.mp4 && return 0
            fi
            yt-dlp --no-playlist --no-warnings \
              -f "b/bv*+ba/bv*/b*" \
              --remux-video mp4 \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -o /tmp/clip.mp4 "$U"
          }
          ok=""
          for U in "$URL" "$ALT1" "$ALT2"; do
            if try_fetch "$U" && [ -s /tmp/clip.mp4 ]; then ok="1"; break; fi
          done
          [ -n "$ok" ] || { echo "ALL SOURCES FAILED"; exit 1; }
          ls -la /tmp/clip.mp4
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("/tmp/clip.mp4")
          size = p.stat().st_size
          assert size > 300_000, f"file too small: {size}"
          head = p.open("rb").read(256)
          assert b"ftyp" in head, f"not an mp4: {head[:16]!r}"
          print(f"OK mp4, {size} bytes")
          EOF
          mkdir -p "$(dirname "${{ steps.req.outputs.out }}")"
          cp /tmp/clip.mp4 "${{ steps.req.outputs.out }}"
          if [ -n "${{ steps.req.outputs.thumb }}" ]; then
            curl -fsSL --retry 3 --max-time 60 \
              -A "Mozilla/5.0" "${{ steps.req.outputs.thumb }}" \
              -o "${{ steps.req.outputs.thumb_out }}" || echo "thumb failed (non-fatal)"
          fi
          command -v ffprobe >/dev/null && ffprobe -v error -show_entries \
            format=duration,size:stream=codec_name,width,height -of default=noprint_wrappers=1 \
            "${{ steps.req.outputs.out }}" || echo "ffprobe not available"

      - name: Commit clip
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.req.outputs.out }}" "${{ steps.req.outputs.thumb_out }}"
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fetch: ${{ steps.req.outputs.name }} (raw clip via actions)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
